name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # registry.json 수정 후 재생성을 깜빡한 드리프트를 잡는 게이트.
      - run: pnpm registry:build && pnpm gen:llms
      - run: git diff --exit-code -- public/r public/llms.txt
      # ko-catalog.json(extract.mjs 산출 — 번역 대상 키 목록)도 같은 방식으로 검증한다.
      # t() 호출을 고치고 재생성을 깜빡하면 messages.test.ts 의 누락 검사 기준이 낡는다.
      - run: node scripts/i18n/extract.mjs
      - run: git diff --exit-code -- scripts/i18n/ko-catalog.json

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
